# dsh-code-review —— bundle patch：把本插件的组合树行插进 profile。
#
# 形态（DSH 0.1.x/0.2.x 官方装载机制，与 宿主既有插件范式 相同）：
#   宿主按 profile 的 bundle 清单逐个读取每个包的 dsh.bundle.patch 指向的
#   patch 文件并叠加成组合树；本文件把 id/name 均为 dsh-code-review 的一行
#   插到组合树顶层，宿主再按该 name 从 profile 的 node_modules 解析到本包
#   （junction 指向插件根，见 README 的安装一节）并装载其 apply 入口。
#
# 零敏感：不含任何平台内部标识。
- insert:
    - id: dsh-code-review
      name: 'dsh-code-review'
