name: CI

# 0.2.0 门禁：类型检查 → 测试（跨平台）→ 构建 → 基准（估算模式）。
#
# 红线：任何需要真实凭据或联网的工作**不进 CI**。
# 需要真实端点的验证走 scripts/benchmark-tokens.mjs --real（人工执行）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试（含端到端与安全回归）
        run: npm run test

      - name: 构建
        run: npm run build

      - name: 产物入口可加载
        shell: bash
        run: |
          node --input-type=module -e "import('./dist/plugin/index.js').then(m => { if (m.name !== 'dsh-code-review') process.exit(1); console.log('entry ok'); })"

      - name: token 基准（仅估算，不联网）
        run: node scripts/benchmark-tokens.mjs

  # 单独一刀：确保仓库里没有被误提交的凭据/私钥。
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查敏感文件是否被跟踪
        shell: bash
        run: |
          set -e
          # 这些文件类型不应出现在版本控制里
          if git ls-files | grep -Ei '(^|/)(\.env(\..*)?|id_(rsa|ed25519|ecdsa|dsa)|.*\.(pem|p12|pfx|key))$'; then
            echo "::error::发现被跟踪的敏感文件"
            exit 1
          fi
          echo "未发现被跟踪的敏感文件"
